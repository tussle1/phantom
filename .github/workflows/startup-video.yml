name: Record Windows startup
on:
  push:
    paths:
      - 'tools/record_windows_startup.py'
      - '.github/workflows/startup-video.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  record:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install recording dependencies
        run: |
          python -m pip install -r requirements-gui.txt Pillow==11.2.1 imageio-ffmpeg==0.6.0
          py -3 -m pip install -r requirements-gui.txt
      - name: Capture real application startup
        run: python tools/record_windows_startup.py docs/demos/startup-cmd.mp4
      - name: Publish recording to this branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demos/startup-cmd.mp4
          git commit -m "Add Windows startup recording"
          git push origin $env:GITHUB_REF_NAME
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-cmd-startup
          path: docs/demos/startup-cmd.mp4
          if-no-files-found: error
          retention-days: 14
