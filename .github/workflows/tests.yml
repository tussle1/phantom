name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Qt offscreen system libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install GUI dependencies
        run: python -m pip install -r requirements-gui.txt
      - name: Compile native modules
        run: python -m compileall -q native phantom.py
      - name: Test decoders, math, configs, and legacy API
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/run_tests.py
      - name: Check Windows imports and INPUT ABI (no game access)
        if: runner.os == 'Windows'
        run: python -c "import ctypes; from native import windows; assert ctypes.sizeof(windows.INPUT) == 40"
      - name: Build and test C++ foundation
        run: |
          cmake -S cpp -B build-cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cpp --config Release
          ctest --test-dir build-cpp -C Release --output-on-failure
