name: Windows package
on:
  push:
    paths:
      - 'native/**'
      - 'phantom.py'
      - 'tools/package_windows.py'
      - 'tests/**'
      - 'README.md'
      - '.github/workflows/windows-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify Windows API imports and INPUT ABI
        run: python -c "import ctypes; from native import windows; assert ctypes.sizeof(windows.INPUT) == 40"
      - name: Install packager
        run: python -m pip install pyinstaller==6.16.0
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm --onefile --name phantom-native phantom.py
      - name: Smoke test packaged executable (no game access)
        shell: pwsh
        run: |
          & .\dist\phantom-native.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\phantom-native.exe --check-profile --profile native/profiles/reference-26598758.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create ZIP with executable, profile, and instructions
        run: python tools/package_windows.py --exe dist/phantom-native.exe --output artifacts/phantom-windows-x64.zip --revision ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-windows-x64
          path: artifacts/phantom-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
