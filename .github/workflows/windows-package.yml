name: Windows package
on:
  push:
    paths:
      - 'native/**'
      - 'phantom.py'
      - 'requirements-gui.txt'
      - 'tools/package_windows.py'
      - 'tests/**'
      - 'cpp/**'
      - 'README.md'
      - '.github/workflows/windows-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install GUI dependencies
        run: python -m pip install -r requirements-gui.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/run_tests.py
      - name: Verify Windows API imports and INPUT ABI
        run: python -c "import ctypes; from native import windows; assert ctypes.sizeof(windows.INPUT) == 40"
      - name: Build and smoke-test C++ foundation
        run: |
          cmake -S cpp -B build-cpp -A x64
          cmake --build build-cpp --config Release
          ctest --test-dir build-cpp -C Release --output-on-failure
      - name: Install packager
        run: python -m pip install pyinstaller==6.16.0
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --icon native/assets/phantom.ico --add-data "native/assets;native/assets" --name phantom-native phantom.py
      - name: Smoke test packaged executable (no game access)
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\dist\phantom-native.exe).Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--help') -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $process = Start-Process -FilePath $exe -ArgumentList @('--check-profile', '--profile', 'native/profiles/reference-26598758.json') -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process -FilePath $exe -ArgumentList @('--gui', '--profile', 'native/profiles/reference-26598758.json', '--config-dir', 'artifacts/preview-config', '--screenshot-dir', 'artifacts/ui') -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          if (!(Test-Path artifacts/ui/gui-expanded.png)) { throw 'GUI screenshot smoke test failed' }
      - name: Create ZIP with executable, profile, and instructions
        shell: pwsh
        run: |
          $dll = (Get-ChildItem build-cpp -Recurse -Filter phantom-internal-foundation.dll | Select-Object -First 1).FullName
          if (!$dll) { throw 'C++ foundation DLL was not built' }
          python tools/package_windows.py --exe dist/phantom-native.exe --output artifacts/phantom-windows-x64.zip --revision ${{ github.sha }} --foundation-dll $dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -Path artifacts/phantom-windows-x64.zip -DestinationPath artifacts/windows-package
          Copy-Item artifacts/ui/*.png artifacts/windows-package/
          $manifest = Get-Content artifacts/windows-package/BUILD.json | ConvertFrom-Json
          $dllPath = Join-Path artifacts/windows-package 'phantom-cpp/phantom-internal-foundation.dll'
          if (!(Test-Path $dllPath)) { throw 'Packaged C++ foundation DLL missing' }
          $dllHash = (Get-FileHash $dllPath -Algorithm SHA256).Hash.ToLower()
          if ($dllHash -ne $manifest.cpp_foundation_sha256) { throw 'Packaged C++ DLL checksum mismatch' }
          $actual = (Get-FileHash artifacts/windows-package/phantom-native.exe -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $manifest.executable_sha256) { throw 'Packaged EXE checksum mismatch' }
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-windows-x64
          path: artifacts/windows-package/
          if-no-files-found: error
          retention-days: 14
