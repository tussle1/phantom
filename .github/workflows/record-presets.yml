name: Record customization and presets
on:
  push:
    branches: ['arena/c8f8204a-phantom']
    paths: ['.github/workflows/record-presets.yml', 'tools/record_gui.py', 'native/presets.py', 'native/gui.py', 'tests/test_gui.py']
permissions:
  contents: write
jobs:
  record:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-gui.txt imageio-ffmpeg==0.6.0
      - name: Test actual widgets and presets
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/run_tests.py
      - name: Record actual GUI without starting worker
        run: python tools/record_gui.py --output docs/demos/gui-demo.mp4
      - name: Validate video and capture presets page
        env:
          QT_QPA_PLATFORM: offscreen
        shell: python
        run: |
          import os, sys, subprocess
          sys.path.insert(0, os.getcwd())
          import imageio_ffmpeg as ff
          assert ff.count_frames_and_secs('docs/demos/gui-demo.mp4') == (720, 24.0)
          subprocess.run([ff.get_ffmpeg_exe(), '-v', 'error', '-i', 'docs/demos/gui-demo.mp4', '-f', 'null', '-'], check=True)
          from PySide6.QtWidgets import QApplication
          from PySide6.QtTest import QTest
          from native.gui import ControlPanel
          app = QApplication([])
          panel = ControlPanel('native/profiles/reference-26598758.json', 'artifacts/preset-preview')
          panel.show()
          panel.select_page('Configs')
          panel.preset_combo.setCurrentText('combined practice')
          QTest.qWait(350)
          assert panel.grab().save('docs/screenshots/gui-presets.png')
          panel.close()
      - name: Save requested media on working branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/demos/gui-demo.mp4 docs/screenshots/gui-presets.png
          git commit -m "Record actual GUI customization and presets demo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:arena/c8f8204a-phantom
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
