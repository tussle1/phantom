name: Capture ESP designer
on:
  push:
    branches: ['arena/6db1b19b-phantom']
    paths: ['.github/workflows/capture-esp-editor.yml', 'native/esp_editor.py', 'native/esp_style.py', 'native/gui.py', 'tests/test_gui.py']
permissions:
  contents: write
jobs:
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-gui.txt
      - name: Test actual editor and shared drawing commands
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/run_tests.py
      - name: Capture actual editor without starting worker
        env:
          QT_QPA_PLATFORM: offscreen
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, os.getcwd())
          from PySide6.QtWidgets import QApplication
          from PySide6.QtTest import QTest
          from native.gui import ControlPanel
          app = QApplication([])
          panel = ControlPanel('native/profiles/reference-26598758.json', 'artifacts/editor-preview')
          panel.show()
          panel.select_page('Visuals')
          panel.open_esp_editor()
          panel.esp_editor.change_style('box', True)
          panel.esp_editor.change_style('line_width', 2)
          panel.change('priority_bone', 'chest')
          QTest.qWait(350)
          assert panel.esp_editor.grab().save('docs/screenshots/gui-esp-editor.png')
          assert panel.model.config.aim == 'off'
          panel.esp_editor.close()
          panel.close()
      - name: Save requested screenshot on working branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/gui-esp-editor.png
          git commit -m "Capture actual interactive skeleton ESP designer"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:arena/6db1b19b-phantom
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
