name: Capture GUI screenshots
on:
  push:
    branches: ['arena/127efea7-phantom']
    paths: ['.github/workflows/capture-preview.yml']
permissions:
  contents: write
jobs:
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - run: python -m pip install -r requirements-gui.txt
      - name: Capture the actual Qt panel without game access
        env:
          QT_QPA_PLATFORM: offscreen
        run: python phantom.py --gui --profile native/profiles/reference-26598758.json --config-dir artifacts/capture-config --screenshot-dir docs/screenshots
      - name: Save requested screenshots to the working branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/gui-expanded.png docs/screenshots/gui-compact.png
          git commit -m "Capture actual expanded and compact Poppins control panel"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:arena/127efea7-phantom
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
