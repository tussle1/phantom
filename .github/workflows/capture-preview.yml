name: Capture GUI screenshots
on:
  push:
    branches: ['arena/aa78817e-phantom']
    paths: ['.github/workflows/capture-preview.yml', 'tests/test_gui.py']
permissions:
  contents: write
jobs:
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-gui.txt
      - name: Test actual Qt controls
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/run_tests.py
      - name: Capture actual Qt panel
        env:
          QT_QPA_PLATFORM: offscreen
        run: python phantom.py --gui --profile native/profiles/reference-26598758.json --config-dir artifacts/capture-config --screenshot-dir docs/screenshots
      - name: Save screenshots to working branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/gui-expanded.png docs/screenshots/gui-compact.png
          git commit -m "Capture lowercase horizontal GUI on Windows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:arena/aa78817e-phantom
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
