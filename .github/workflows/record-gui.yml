name: Record GUI demo
on:
  push:
    branches: ['arena/6bd8c70e-phantom']
    paths: ['.github/workflows/record-gui.yml', 'tools/record_gui.py']
permissions:
  contents: write
jobs:
  record:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-gui.txt imageio-ffmpeg==0.6.0
      - name: Record actual Qt frames without game access
        run: python tools/record_gui.py --output docs/demos/gui-demo.mp4
      - name: Save the requested clip to this working branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/demos/gui-demo.mp4
          git commit -m "Add actual v1.2.0 GUI animation recording"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:arena/6bd8c70e-phantom
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
