name: Record full skeleton designer walkthrough
on:
  push:
    branches: ['arena/42caf573-phantom']
    paths: ['.github/workflows/record-designer.yml', 'tools/record_esp_designer.py']
permissions:
  contents: write
jobs:
  record:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-gui.txt imageio-ffmpeg==0.6.0
      - name: Test GUI and config behavior
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/run_tests.py
      - name: Record all actual designer controls without starting worker
        run: python tools/record_esp_designer.py --output docs/demos/esp-designer-walkthrough.mp4
      - name: Decode and validate the complete video
        shell: python
        run: |
          import subprocess
          import imageio_ffmpeg as ff
          assert ff.count_frames_and_secs('docs/demos/esp-designer-walkthrough.mp4') == (2340,78.0)
          subprocess.run([ff.get_ffmpeg_exe(),'-v','error','-i','docs/demos/esp-designer-walkthrough.mp4','-f','null','-'], check=True)
      - name: Save requested video on working branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/demos/esp-designer-walkthrough.mp4
          git commit -m "Record complete ESP designer control walkthrough"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:arena/42caf573-phantom
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
